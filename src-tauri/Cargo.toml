[package]
name = "lion-ssh"
version = "1.10.5"
description = "Lion SSH desktop application and native SSH backend"
authors = ["Lion SSH contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
tempfile = "3"
tar = "0.4"
semver = "1"
minisign-verify = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
regex = "1"
rand = "0.9"
tokio-util = { version = "0.7", features = ["rt"] }
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
rfd = "0.17"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_SystemServices", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_FileSystem"] }
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[target.'cfg(not(windows))'.dependencies]
aes-gcm = "0.10.3"
dirs = "6"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-dragout = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSDragging", "NSPasteboard", "NSView", "NSFilePromiseReceiver"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSURL", "NSString", "NSGeometry"] }
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
aes-gcm = "0.10.3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
